<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OutreachXP</title>
    <meta name="description" content="Raise Ping, your outreach companion, by logging outreach for the Serious Games Showcase & Challenge." />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wdth,wght@75..100,400..800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./src/styles.css" />
    <link rel="stylesheet" href="./src/app/app.css" />

  <body class="app">

      <div class="topbar-sub" id="season-label"></div>
      <div class="topbar-level" id="level-chip"></div>
    </header>
    <nav class="tabs" aria-label="Main">
      <a href="#home" data-tab="home">Home</a>
      <a href="#pipeline" data-tab="pipeline">Pipeline</a>

      <a href="#season" data-tab="season">Season</a>
      <a href="#data" data-tab="data">Data</a>

    <main id="view" class="view" tabindex="-1"></main>
    <dialog id="quicklog" class="modal" aria-labelledby="quicklog-title"></dialog>

    <script type="module" src="./src/app/main.ts"></script>
