<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>OutreachXP</title>
    <meta name="description" content="Raise Ping, your outreach companion, by logging outreach for the Serious Games Showcase & Challenge." />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#232323" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="OutreachXP" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <link rel="stylesheet" href="./src/styles.css" />
    <link rel="stylesheet" href="./src/app/app.css" />
  </head>
  <body class="app">
    <header class="topbar">
      <div class="wordmark">Outreach<span>XP</span></div>
      <div class="topbar-sub" id="season-label"></div>
      <div class="topbar-level" id="level-chip"></div>
    </header>
    <nav class="tabs" aria-label="Main">
      <a href="#home" data-tab="home"><span class="tab-icon" aria-hidden="true">🏠</span><span class="tab-label">Home</span></a>
      <a href="#pipeline" data-tab="pipeline"><span class="tab-icon" aria-hidden="true">📋</span><span class="tab-label">Pipeline</span></a>
      <a href="#quests" data-tab="quests"><span class="tab-icon" aria-hidden="true">🎯</span><span class="tab-label">Quests</span></a>
      <a href="#achievements" data-tab="achievements"><span class="tab-icon" aria-hidden="true">🏆</span><span class="tab-label">Achievements</span></a>
      <a href="#stats" data-tab="stats"><span class="tab-icon" aria-hidden="true">📊</span><span class="tab-label">Stats</span></a>
      <a href="#season" data-tab="season"><span class="tab-icon" aria-hidden="true">📅</span><span class="tab-label">Season</span></a>
      <a href="#data" data-tab="data"><span class="tab-icon" aria-hidden="true">💾</span><span class="tab-label">Data</span></a>
    </nav>
    <main id="view" class="view" tabindex="-1"></main>
    <dialog id="quicklog" class="modal" aria-labelledby="quicklog-title"></dialog>
    <div id="update-bar" class="update-bar" role="status" hidden>
      <span>A new version of OutreachXP is ready.</span>
      <button class="btn btn-primary btn-small" type="button">Reload</button>
    </div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script type="module" src="./src/app/main.ts"></script>
  </body>
</html>
